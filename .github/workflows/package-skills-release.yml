name: Package Skills Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type for manual dispatch'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  package-and-release:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main') }}
    name: Package skills and publish release assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install semver
        run: npm install semver

      - name: Create zip archives for each skill
        run: |
          mkdir -p release-artifacts
          for folder in skills/*; do
            if [ -d "$folder" ]; then
              name=$(basename "$folder")
              zip -r "release-artifacts/$name.zip" "$folder"
            fi
          done

      - name: Set semver release tag
        id: semver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release_type="${{ github.event.inputs.release_type }}"
          else
            release_type=minor
          fi
          git fetch --tags
          latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$latest_tag" ]; then
            latest_tag="v0.0.0"
          fi
          version=${latest_tag#v}
          next_version=$(npx semver "$version" "$release_type")
          echo "version=v${next_version}" >> "$GITHUB_OUTPUT"

      - name: Publish or update GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag="${{ steps.semver.outputs.version }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release_type="${{ github.event.inputs.release_type }}"
            release_notes="Automated release dispatch (${release_type})"
          else
            release_notes="Automated release for merged PR #${{ github.event.pull_request.number }}"
          fi
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" release-artifacts/*.zip --clobber
          else
            gh release create "$release_tag" release-artifacts/*.zip \
              --title "$release_tag" \
              --notes "$release_notes" \
              --draft \
              --prerelease
          fi
