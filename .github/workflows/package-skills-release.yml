name: Package Skills Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type for manual dispatch'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

  push:
    branches: [main]

permissions:
  contents: write

jobs:
  package-and-release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    name: Package skills and publish release assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install semver
        run: npm install semver

      - name: Create zip archives for each skill
        run: |
          mkdir -p release-artifacts
          for folder in skills/*; do
            if [ -d "$folder" ]; then
              name=$(basename "$folder")
              zip -r "release-artifacts/$name.zip" "$folder"
            fi
          done

      - name: Set semver release tag
        id: semver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release_type="${{ github.event.inputs.release_type }}"
          else
            release_type=minor
          fi
          git fetch --tags --prune
          latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          # If no git tags are present locally, fall back to the latest GitHub release tag
          if [ -z "$latest_tag" ] || [ "$latest_tag" = "" ]; then
            latest_tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          fi
          if [ -z "$latest_tag" ] || [ "$latest_tag" = "null" ]; then
            latest_tag="v0.0.0"
          fi
          version=${latest_tag#v}
          echo "DEBUG: latest_tag=$latest_tag" >&2
          echo "DEBUG: base version=$version" >&2
          next_version=$(node -e "try{const s=require('semver'); console.log(s.inc(process.argv[1], process.argv[2]));}catch(e){process.exit(0)}" "$version" "$release_type" 2>/dev/null || true)
          echo "DEBUG: next_version=$next_version" >&2
          if [ -z "$next_version" ]; then
            echo "version=v0.0.0" >> "$GITHUB_OUTPUT"
          else
            echo "version=v${next_version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish or update GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag="${{ steps.semver.outputs.version }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release_type="${{ github.event.inputs.release_type }}"
            release_notes="Automated release dispatch (${release_type})"
          else
            # running on push to main: attempt to find the merged PR for this commit
            commit_sha=${GITHUB_SHA}
            pr_number=$(gh api repos/${GITHUB_REPOSITORY}/commits/${commit_sha}/pulls -H "Accept: application/vnd.github.groot-preview+json" --jq '.[0].number' 2>/dev/null || true)
            if [ -n "$pr_number" ] && [ "$pr_number" != "null" ]; then
              pr_title=$(gh api repos/${GITHUB_REPOSITORY}/pulls/$pr_number --jq '.title' 2>/dev/null || true)
              pr_body=$(gh api repos/${GITHUB_REPOSITORY}/pulls/$pr_number --jq '.body' 2>/dev/null || true)
              release_notes=$(printf 'Merged PR #%s: %s\n\n%s' "$pr_number" "$pr_title" "$pr_body")
            else
              release_notes="Automated release for push to main (${commit_sha})"
            fi
          fi
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" release-artifacts/*.zip --clobber
          else
            gh release create "$release_tag" release-artifacts/*.zip \
              --title "$release_tag" \
              --notes "$release_notes" \
              --prerelease
          fi
